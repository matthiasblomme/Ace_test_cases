{
  "openapi": "3.0.3",
  "info": {
    "title": "Dummy API",
    "version": "1.0.0",
    "description": "A dummy API for an ACE template project. Includes a simple POST operation, a GET greeting, test endpoints that return specific HTTP errors (GET + POST), basic input/output schemas defined as components, and OAuth 2.0 security using the client credentials flow.\n"
  },
  "servers": [
    {
      "url": "https://api.example.com/dummyapi/v1"
    }
