  "paths": {
    "/hello": {
      "get": {
        "summary": "Retrieve a greeting",
        "description": "Test endpoint that returns a greeting message.\n",
        "responses": {
          "200": {
            "description": "Successful response with greeting message.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HelloResponse"
                },
                "example": {
                  "message": "Hello, Foo Bar!"
                }
              }
            }
          }
        },
        "security": [
          {
            "oauth2": []
          }
        ]
      },
      "post": {
        "summary": "Send a greeting",
        "description": "Accepts a name and responds with a greeting message.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/HelloRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful response with greeting message.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HelloResponse"
                },
                "example": {
                  "message": "Hello, Foo Bar!"
                }
              }
            }
          },
          "400": {
            "description": "Bad Request – invalid input."
          }
        },
        "security": [
          {
            "oauth2": []
          }
        ]
      }
    },
