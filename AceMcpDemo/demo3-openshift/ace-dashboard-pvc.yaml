apiVersion: v1                              # Core API group
kind: PersistentVolumeClaim                 # Backing storage for the Dashboard's BAR file content server
metadata:
  name: ace-dashboard-content               # Referenced from the Dashboard CR as spec.storage.claimName
  namespace: ace-mcp-demo                   # Same namespace as the Dashboard instance
spec:
  accessModes:
    - ReadWriteOnce                         # One node mounts it read-write, which suits a single-replica Dashboard
  resources:
    requests:
      storage: 5Gi                          # Ample for demo BAR files
  # storageClassName is deliberately omitted so the cluster's default StorageClass is used.
  # A TechZone OCP-v cluster has one. If the claim stays Pending, check 'oc get storageclass'
  # and set storageClassName explicitly.
